backend:
  name: github
  repo: callmeiskay/portfolio
  branch: main

# Ảnh upload sẽ được lưu vào thư mục này trong repo
media_folder: public/images/uploads
# Đường dẫn ảnh mà trang web sẽ dùng
public_folder: /images/uploads

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: projects
        label: Dự án
        file: public/content/projects.json
        fields:
          - label: Danh sách dự án
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Tiêu đề, name: title, widget: string }
              - { label: Tiêu đề phụ, name: subtitle, widget: string, required: false }
              - label: Danh mục
                name: category
                widget: select
                options: [Portrait, Yearbook, Event, Architectural, "Design & Brand Identity"]
              - { label: Năm, name: year, widget: string, default: "2026" }
              - { label: Ảnh bìa, name: imageUrl, widget: image, required: false }
              - { label: Khách hàng / Bối cảnh, name: client, widget: string, required: false }
              - { label: Vai trò, name: role, widget: string, required: false }
              - label: Công cụ
                name: tools
                widget: list
                required: false
                field: { label: Công cụ, name: tool, widget: string }
              - { label: Tóm tắt, name: summary, widget: text, required: false }
              - { label: Thách thức, name: challenge, widget: text, required: false }
              - { label: Cách tiếp cận, name: solution, widget: text, required: false }
              - label: Sản phẩm bàn giao
                name: deliverables
                widget: list
                required: false
                field: { label: Sản phẩm, name: item, widget: string }
              - label: Bảng màu (mã HEX, ví dụ #141413)
                name: palette
                widget: list
                required: false
                field: { label: Mã màu, name: color, widget: string }
              - label: Kiểu hình minh họa (khi chưa có ảnh bìa)
                name: visualType
                widget: select
                options: [editorial, danang, ananas, cinema]
                default: editorial
              - { label: Link Behance, name: behanceLink, widget: string, required: false }
              - { label: Link Instagram, name: igLink, widget: string, required: false }
      - name: profile
        label: Thông tin cá nhân
        file: public/content/profile.json
        fields:
          - { label: Họ và tên, name: name, widget: string }
          - { label: Đoạn giới thiệu ở đầu trang, name: philosophy, widget: text, required: false }
          - { label: Tiêu đề mục About, name: aboutHeading, widget: string, required: false }
          - { label: Ảnh chân dung, name: aboutAvatarUrl, widget: image, required: false }
          - { label: About - đoạn chính (chữ lớn), name: aboutLead, widget: text, required: false }
          - { label: About - đoạn chi tiết (chữ nhỏ), name: aboutDetail, widget: text, required: false }
          - { label: Email liên hệ, name: email, widget: string, required: false }
          - { label: Dòng trạng thái (mục Contact), name: status, widget: string, required: false }
          - { label: Tên hiển thị Behance, name: behance, widget: string, required: false }
          - { label: Link Behance, name: behanceUrl, widget: string, required: false }
          - { label: Tên hiển thị Instagram, name: instagram, widget: string, required: false }
          - { label: Link Instagram, name: instagramUrl, widget: string, required: false }
