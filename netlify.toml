[build]
  command = "npm run build"
  publish = "dist"

# File code của Vite có tên băm theo nội dung nên có thể lưu lâu trong trình duyệt khách
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ảnh upload: lưu 1 ngày để lần xem sau nhanh hơn, vẫn cập nhật kịp khi bạn đổi ảnh
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
